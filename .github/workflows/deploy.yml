name: Continuous Deployment

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  ci-check:
    name: Run Quality & Test Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.31.0

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Typecheck
        run: pnpm typecheck

      - name: Run i18n Audit
        run: pnpm check-i18n

      - name: Run API Unit Tests
        run: pnpm --filter @ioma/api test

  deploy:
    name: Deploy to Production VPS
    needs: [ci-check]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - name: Validate Deployment Configuration
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "::error::Secret VPS_HOST is missing! Please configure VPS_HOST in GitHub Settings -> Secrets and variables -> Actions"
            exit 1
          fi

      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 30m
          script: |
            echo "🚀 Starting automated deployment on VPS..."
            
            # Detect deployment root directory
            if [ -n "${{ secrets.VPS_PROJECT_DIR }}" ]; then
              TARGET_DIR="${{ secrets.VPS_PROJECT_DIR }}"
            elif [ -d "/root/ioma" ]; then
              TARGET_DIR="/root/ioma"
            elif [ -d "$HOME/ioma" ]; then
              TARGET_DIR="$HOME/ioma"
            else
              TARGET_DIR="$(pwd)"
            fi
            
            echo "📂 Deployment target directory: $TARGET_DIR"
            cd "$TARGET_DIR" || exit 1
            
            BRANCH="${{ github.ref_name }}"
            echo "📥 Synchronizing latest code from origin/$BRANCH..."
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            
            echo "🐳 Building updated production Docker containers (web & api)..."
            docker compose -f infrastructure/docker/compose.prod.yml build web api
            
            echo "🔄 Applying zero-downtime restart (web & api only, preserving database)..."
            docker compose -f infrastructure/docker/compose.prod.yml up -d --no-deps web api
            
            echo "⏳ Waiting 20 seconds for application bootstrap and healthchecks..."
            sleep 20
            
            echo "🔍 Running production verification audits..."
            # Check internal API health inside container
            docker exec ioma-prod-api wget -qO- http://localhost:4000/api/health || {
              echo "❌ Internal API healthcheck failed!"
              exit 1
            }
            
            # Check host exposed API health (Port 4200)
            curl -s -f http://localhost:4200/api/health || {
              echo "❌ Host API port 4200 check failed!"
              exit 1
            }
            
            # Check host exposed Web storefront (Port 3200)
            curl -s -f -o /dev/null -w "%{http_code}" http://localhost:3200/en || {
              echo "❌ Storefront port 3200 check failed!"
              exit 1
            }
            
            echo "🧹 Cleaning up dangling build images..."
            docker image prune -f
            
            echo "✅ Deployment completed and verified successfully!"
            docker ps --filter "name=ioma-prod" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
